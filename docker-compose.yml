services:
  db:
    image: postgres:15
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duofinance"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: [
      "sh","-c",
      "migrate -path=/migrations -database '$MIGRATIONS_DSN' up || true"
    ]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: duofinance_pgadmin
    env_file:
      - ./backend/.env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

  # Vite dev server with bind mount — HMR without rebuilding the image.
  # Run: docker compose --profile dev up frontend-dev (omit the production `frontend` service to avoid port 3000 conflict).
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    environment:
      VITE_USE_POLLING: "1"
    depends_on:
      - backend
    # Re-run npm ci when package-lock.json changes (named volume can outlive new deps).
    command:
      [
        "sh",
        "-c",
        "if [ ! -f node_modules/.npm-ci-stamp ] || [ package-lock.json -nt node_modules/.npm-ci-stamp ]; then npm ci && touch node_modules/.npm-ci-stamp; fi; exec npm run dev -- --host 0.0.0.0 --port 3000",
      ]

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dev_node_modules: